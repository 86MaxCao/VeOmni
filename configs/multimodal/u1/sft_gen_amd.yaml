model:
  model_path: __MODEL_PATH__
  ops_implementation:
    attn_implementation: flash_attention_2
    rms_norm_implementation: eager
    swiglu_mlp_implementation: eager
    rotary_pos_emb_implementation: eager
    cross_entropy_loss_implementation: eager
    load_balancing_loss_implementation: eager
    moe_implementation: eager

data:
  train_path: __TRAIN_DATA_PATH__
  data_type: conversation
  chat_template: qwen3vl
  datasets_type: iterable
  source_name: qwen_omni_offline_av
  silent_exception: true
  max_seq_len: 4096
  train_size: 80000000
  mm_configs:
    image_root: __IMAGE_ROOT__
    image_max_pixels: 602112

train:
  accelerator:
    ulysses_size: 1
    fsdp_config:
      fsdp_mode: fsdp2
      mixed_precision:
        enable: false
  gradient_checkpointing:
    enable: true
    enable_reentrant: false
  wandb:
    enable: true
    project: unified_sft
    name: u1_gen_sft_amd
  # --- U1 freeze 策略: 阶段 1 生成分支训练 ---
  # 对齐 SenseNova-U1 官方 SFT 配置
  freeze_vit: true
  freeze_llm: true            # 冻结 LLM backbone
  freeze_mlp: true            # 冻结 mlp1 projector
  freeze_gen_modules: false   # FM 模块可训练
  unfreeze_mot_gen: true      # 解冻 *_mot_gen 参数（生成路径 QKV）
  unfreeze_vit_layers: -4     # 解冻最后 4 层 ViT encoder
  unfreeze_lm_head: true      # 解冻 lm_head
  mse_weight: 1.0
  ce_weight: 1.0
  optimizer:
    lr: 1.0e-5
    lr_decay_style: cosine
    weight_decay: 0.01
    max_grad_norm: 1.0
  num_train_epochs: 3
  micro_batch_size: 1
  global_batch_size: 16
  init_device: meta
  checkpoint:
    output_dir: __OUTPUT_DIR__
    manager: dcp
    save_hf_weights: true
    save_steps: 200
